<!DOCTYPE html>
<html lang="en" id="root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="picture/logo.jpg" type="image/x-icon">
  <title>Shopping Cart – Furniture Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #F5F0E6;
      --text: #2A2A2A;
      --accent: #5D4037;
      --highlight: #C6A961;
      --card: #FFFFFF;
      --border: #E0D8C8;
      --shadow: rgba(0,0,0,0.1);
      --nav-height: 70px;
    }

    .dark-theme {
      --bg: #1A1815;
      --text: #E8E2D5;
      --card: #25221F;
      --border: #3A352F;
      --shadow: rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
      transition: background-color 0.4s, color 0.4s;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    header {
      background-color: var(--accent);
      color: white;
      padding: 1.2rem 5%;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    nav {
      background-color: var(--card);
      padding: 0 5%;
      box-shadow: 0 2px 8px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      height: var(--nav-height);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--highlight);
    }

    .cart-count {
      background: var(--highlight);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: top;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .theme-toggle:hover {
      background: var(--border);
    }

    .tognav {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .tognav:hover {
      background: var(--border);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--nav-height);
      left: 0;
      width: 100%;
      background: var(--card);
      box-shadow: 0 4px 15px var(--shadow);
      z-index: 999;
      transform: translateY(-100%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .mobile-menu.active {
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu ul {
      list-style: none;
    }

    .mobile-menu ul li {
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu ul li:last-child {
      border-bottom: none;
    }

    .mobile-menu ul li a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 5%;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: background 0.3s, color 0.3s;
    }

    .mobile-menu ul li a:hover {
      background: var(--border);
      color: var(--highlight);
    }

    .mobile-menu ul li a i {
      width: 24px;
      text-align: center;
      color: var(--highlight);
    }

    main {
      padding: 3rem 5%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 2rem;
      font-size: 2.2rem;
    }

    .empty-cart {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 6px 15px var(--shadow);
      border: 1px solid var(--border);
    }

    .empty-cart i {
      font-size: 4rem;
      color: var(--highlight);
      margin-bottom: 1rem;
    }

    .empty-cart h2 {
      color: var(--accent);
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .empty-cart p {
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .empty-cart .checkoutbut {
      display: inline-block;
      width: auto;
      padding: 0.8rem 2rem;
    }

    .cart-item {
      display: flex;
      gap: 1.5rem;
      padding: 1.5rem;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.2rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .cart-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px var(--shadow);
    }

    .cart-item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-info h3 {
      margin-bottom: 0.5rem;
      color: var(--text);
      font-size: 1.2rem;
    }

    .item-prices {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      font-size: 1rem;
    }

    .price {
      color: var(--highlight);
      font-weight: bold;
      font-size: 1.2rem;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.5rem 0;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }

    .quantity button:hover {
      background: #4a332c;
      transform: scale(1.1);
    }

    .quantity span {
      font-weight: bold;
      font-size: 1.1rem;
      min-width: 30px;
      text-align: center;
    }

    .remove {
      color: #e74c3c;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 5px 0;
      align-self: flex-start;
      transition: color 0.3s;
    }

    .remove:hover {
      color: #c0392b;
      text-decoration: underline;
    }

    .cart-summary {
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      margin-top: 2rem;
      text-align: right;
      box-shadow: 0 6px 15px var(--shadow);
      border: 1px solid var(--border);
    }

    .cart-summary .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 1.3rem;
    }

    .cart-summary .total-row strong {
      color: var(--accent);
    }

    .cart-summary .total-row span {
      color: var(--highlight);
      font-weight: bold;
      font-size: 1.5rem;
    }

    .checkoutbut {
      display: inline-block;
      background: var(--highlight);
      color: var(--text);
      padding: 0.9rem 2rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 1rem;
      transition: transform 0.3s, box-shadow 0.3s;
      font-family: 'Georgia', serif;
      font-size: 1rem;
    }

    .checkoutbut:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(198,169,97,0.4);
    }

    footer {
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }

    @media (max-width: 992px) {
      header h1 {
        font-size: 1.6rem;
      }

      nav ul {
        gap: 1.2rem;
      }

      nav a {
        font-size: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .cart-item img {
        width: 110px;
        height: 110px;
      }

      .item-info h3 {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 768px) {
      :root {
        --nav-height: 60px;
      }

      header {
        padding: 1rem 4%;
      }

      header h1 {
        font-size: 1.4rem;
      }

      nav {
        padding: 0 4%;
      }

      nav ul {
        display: none;
      }

      .tognav {
        display: flex;
      }

      .mobile-menu {
        display: block;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
      }

      main {
        padding: 2.5rem 4%;
      }

      h1 {
        font-size: 1.7rem;
        margin-bottom: 1.5rem;
      }

      .cart-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem;
        gap: 1rem;
      }

      .cart-item img {
        width: 150px;
        height: 150px;
      }

      .item-info {
        width: 100%;
        align-items: center;
      }

      .item-info h3 {
        font-size: 1.1rem;
      }

      .price {
        font-size: 1.1rem;
      }

      .quantity {
        justify-content: center;
      }

      .remove {
        align-self: center;
      }

      .cart-summary {
        padding: 1.5rem 1.2rem;
      }

      .cart-summary .total-row {
        font-size: 1.15rem;
      }

      .cart-summary .total-row span {
        font-size: 1.3rem;
      }

      .checkoutbut {
        padding: 0.85rem 1.8rem;
        font-size: 0.95rem;
      }

      footer {
        padding: 1.2rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 0.8rem 3%;
      }

      header h1 {
        font-size: 1.2rem;
      }

      nav {
        padding: 0 3%;
      }

      main {
        padding: 2rem 3%;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.2rem;
      }

      .empty-cart {
        padding: 2rem 1.5rem;
      }

      .empty-cart i {
        font-size: 3rem;
      }

      .empty-cart h2 {
        font-size: 1.3rem;
      }

      .cart-item {
        padding: 1rem;
        border-radius: 10px;
      }

      .cart-item img {
        width: 130px;
        height: 130px;
      }

      .item-info h3 {
        font-size: 1rem;
      }

      .price {
        font-size: 1.05rem;
      }

      .old-price {
        font-size: 0.9rem;
      }

      .quantity button {
        width: 30px;
        height: 30px;
        font-size: 0.95rem;
      }

      .quantity span {
        font-size: 1rem;
      }

      .cart-summary {
        padding: 1.3rem 1rem;
        border-radius: 10px;
      }

      .cart-summary .total-row {
        font-size: 1.05rem;
      }

      .cart-summary .total-row span {
        font-size: 1.2rem;
      }

      .checkoutbut {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
        width: 100%;
        text-align: center;
      }

      footer {
        padding: 1rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 360px) {
      header h1 {
        font-size: 1.1rem;
      }

      h1 {
        font-size: 1.35rem;
      }

      .cart-item img {
        width: 110px;
        height: 110px;
      }

      .item-info h3 {
        font-size: 0.95rem;
      }

      .price {
        font-size: 1rem;
      }

      .cart-summary .total-row {
        font-size: 1rem;
      }

      .cart-summary .total-row span {
        font-size: 1.1rem;
      }

      .checkoutbut {
        padding: 0.75rem 1.3rem;
        font-size: 0.88rem;
      }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      :root {
        --nav-height: 55px;
      }

      header {
        padding: 0.6rem 3%;
      }

      header h1 {
        font-size: 1.1rem;
      }

      nav {
        padding: 0 3%;
      }

      main {
        padding: 1.5rem 3%;
      }

      h1 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }

      .cart-item {
        flex-direction: row;
        text-align: left;
        padding: 1rem;
        gap: 1rem;
      }

      .cart-item img {
        width: 100px;
        height: 100px;
      }

      .item-info {
        align-items: flex-start;
      }

      .quantity {
        justify-content: flex-start;
      }

      .remove {
        align-self: flex-start;
      }

      .cart-summary {
        padding: 1.2rem 1rem;
      }

      .cart-summary .total-row {
        font-size: 1rem;
      }

      .cart-summary .total-row span {
        font-size: 1.15rem;
      }

      .checkoutbut {
        padding: 0.75rem 1.3rem;
        font-size: 0.88rem;
      }

      footer {
        padding: 0.8rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1 style="color: white;">Furniture Store</h1>
  </header>

  <nav>
    <div class="nav-container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html">🛒 <span class="cart-count">0</span></a></li>
      </ul>
      <div class="nav-right">
        <button id="toggletheme" class="theme-toggle">
          <i class="fas fa-moon"></i>
        </button>
        <button class="tognav" id="tognav">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobilemenu">
    <ul>
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
      <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
      <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
      <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count">0</span></a></li>
    </ul>
  </div>

  <main>
    <h1>Your Shopping Cart</h1>
    <div id="cartitems"></div>
    <div class="cart-summary" id="cartsumm" style="display:none;">
      <div class="total-row">
        <strong>Total:</strong>
        <span id="totprice">$0</span>
      </div>
      <a href="checkout.html" class="checkoutbut">Proceed to Checkout</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Furniture Store. Crafted with care.</p>
  </footer>

  <script src="darkmode.js"></script>
  <script>
    function getcart() {
      return JSON.parse(localStorage.getItem('cart') || '[]');
    }

    function savecart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updatecart() {
      const cart = getcart();
      const container = document.getElementById('cartitems');
      const totprice = document.getElementById('totprice');
      const summary = document.getElementById('cartsumm');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h2>Your Cart is Empty</h2>
            <p>Looks like you haven't added any items yet.</p>
            <a href="products.html" class="checkoutbut">Browse Products</a>
          </div>
        `;
        summary.style.display = 'none';
        return;
      }

      summary.style.display = 'block';
      let total = 0;
      let html = '';

      cart.forEach(item => {
        const price = parseFloat(item.price);
        const linetot = price * item.quantity;
        total += linetot;

        const oldpriceht = item.oldprice ? 
          `<span class="old-price">$${item.oldprice}</span>` : '';

        html += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}">
            <div class="item-info">
              <h3>${item.name}</h3>
              <div class="item-prices">
                ${oldpriceht}
                <span class="price">$${price.toFixed(2)}</span>
              </div>
              <div class="quantity">
                <button onclick="updateqty('${item.type}', ${item.quantity - 1})">-</button>
                <span>${item.quantity}</span>
                <button onclick="updateqty('${item.type}', ${item.quantity + 1})">+</button>
              </div>
              <button class="remove" onclick="removeitem('${item.type}')">
                <i class="fas fa-trash"></i> Remove
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      totprice.textContent = `$${total.toFixed(2)}`;
    }

    function updateqty(type, qty) {
      if (qty < 1) return;
      const cart = getcart();
      const item = cart.find(i => i.type === type);
      if (item) {
        item.quantity = qty;
        savecart(cart);
        updatecart();
      }
    }

    function removeitem(type) {
      let cart = getcart();
      cart = cart.filter(i => i.type !== type);
      savecart(cart);
      updatecart();
    }

    document.addEventListener('DOMContentLoaded', updatecart);
  </script>
</body>
</html>
