<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart – Furniture Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
      :root {
  --bg: #F5F0E6;          
  --text: #2A2A2A;    
  --accent: #5D4037;    
  --highlight: #C6A961;   
  --card: #FFFFFF;
  --border: #E0D8C8;
}

    .dark-theme {
      --bg: #1A1815;
      --text: #E8E2D5;
      --card: #25221F;
      --border: #3A352F;
      --shadow: rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
      transition: background-color 0.4s, color 0.4s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      background-color: var(--accent);
      color: white;
      padding: 1.2rem 5%;
      text-align: center;
    }

    nav {
      background-color: var(--card);
      padding: 1rem 5%;
      box-shadow: 0 2px 8px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      padding: 3rem 5%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 2rem;
    }

    .cart-item {
      display: flex;
      gap: 1.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      margin-bottom: 0.5rem;
    }

    .price {
      color: var(--highlight);
      font-weight: bold;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-right: 0.5rem;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.8rem 0;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove {
      color: #e74c3c;
      background: none;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    .cart-summary {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      text-align: right;
    }

    .btn {
      display: inline-block;
      background: var(--highlight);
      color: var(--text);
      padding: 0.8rem 2rem;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 1rem;
    }

    footer {
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }
    .cart-count {
  background: var(--highlight); /* Gold: #C6A961 */
  color: var(--text);           /* Dark text */
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 10px;
  margin-left: 4px;
  vertical-align: top;
}
  </style>
</head>
<body>

  <header>
    <h1>Furniture Store</h1>
  </header>

  <nav>
    <div class="nav-container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
   <li><a href="cart.html">🛒 <span class="cart-count">0</span></a></li>
      </ul>
      <button id="themeToggle" class="theme-toggle">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </nav>

  <main>
    <h1>Your Shopping Cart</h1>
    <div id="cartItems">
      <!-- Cart items will be inserted here -->
    </div>
    <div class="cart-summary">
      <div><strong>Total: <span id="totalPrice">$0</span></strong></div>
      <a href="checkout.html" class="btn">Proceed to Checkout</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Furniture Store. Crafted with care.</p>
  </footer>

  <script>
    // Theme toggle
    const html = document.getElementById('htmlRoot');
    const toggleBtn = document.getElementById('themeToggle');
    const icon = toggleBtn.querySelector('i');
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      html.classList.add('dark-theme');
      icon.className = 'fas fa-sun';
    }
    toggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark-theme');
      const isDark = html.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    });

    // Cart functions
    function getCart() {
      return JSON.parse(localStorage.getItem('cart') || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCart() {
      const cart = getCart();
      const container = document.getElementById('cartItems');
      const totalEl = document.getElementById('totalPrice');

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        totalEl.textContent = '$0';
        return;
      }

      let total = 0;
      let html = '';

      cart.forEach(item => {
        const price = parseFloat(item.price);
        const lineTotal = price * item.quantity;
        total += lineTotal;

        const oldPriceHtml = item.oldprice ? 
          `<span class="old-price">$${item.oldprice}</span>` : '';

        html += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}">
            <div class="item-info">
              <h3>${item.name}</h3>
              ${oldPriceHtml}<span class="price">$${price.toFixed(2)}</span>
              <div class="quantity">
                <button onclick="updateQuantity('${item.type}', ${item.quantity - 1})">-</button>
                <span>${item.quantity}</span>
                <button onclick="updateQuantity('${item.type}', ${item.quantity + 1})">+</button>
              </div>
              <button class="remove" onclick="removeItem('${item.type}')">Remove</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    function updateQuantity(type, qty) {
      if (qty < 1) return;
      const cart = getCart();
      const item = cart.find(i => i.type === type);
      if (item) {
        item.quantity = qty;
        saveCart(cart);
        updateCart();
      }
    }

    function removeItem(type) {
      let cart = getCart();
      cart = cart.filter(i => i.type !== type);
      saveCart(cart);
      updateCart();
    }
// In theme toggle script, add:
 function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const countElements = document.querySelectorAll('.cart-count');
    countElements.forEach(el => {
      el.textContent = totalCount;
      el.style.display = totalCount > 0 ? 'inline' : 'none';
    });
  }

  // Run on page load
  document.addEventListener('DOMContentLoaded', updateCartCount);
    // Load cart on page load
    updateCart();

  </script>
</body>
</html>
