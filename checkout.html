<!DOCTYPE html>
<html lang="en" id="root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="picture/logo.jpg" type="image/x-icon">
  <title>Checkout – Furniture Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #F5F0E6;
      --text: #2A2A2A;
      --accent: #5D4037;
      --highlight: #C6A961;
      --card: #FFFFFF;
      --border: #E0D8C8;
      --shadow: rgba(0,0,0,0.1);
      --nav-height: 70px;
    }
    .dark-theme {
      --bg: #1A1815;
      --text: #E8E2D5;
      --card: #25221F;
      --border: #3A352F;
      --shadow: rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
      transition: background-color 0.4s, color 0.4s;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    header {
      background-color: var(--accent);
      color: white;
      padding: 1.2rem 5%;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
    }

    nav {
      background-color: var(--card);
      padding: 0 5%;
      box-shadow: 0 2px 8px var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      height: var(--nav-height);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--highlight);
    }

    .cart-count {
      background: var(--highlight);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: top;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .theme-toggle:hover {
      background: var(--border);
    }

    .tognav {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .tognav:hover {
      background: var(--border);
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--nav-height);
      left: 0;
      width: 100%;
      background: var(--card);
      box-shadow: 0 4px 15px var(--shadow);
      z-index: 999;
      transform: translateY(-100%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .mobile-menu.active {
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu ul {
      list-style: none;
    }

    .mobile-menu ul li {
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu ul li:last-child {
      border-bottom: none;
    }

    .mobile-menu ul li a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 5%;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: background 0.3s, color 0.3s;
    }

    .mobile-menu ul li a:hover {
      background: var(--border);
      color: var(--highlight);
    }

    .mobile-menu ul li a i {
      width: 24px;
      text-align: center;
      color: var(--highlight);
    }

    main {
      padding: 3rem 5%;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - var(--nav-height) - 150px);
    }

    h2 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-size: 1.6rem;
    }

    .form-section, .summary-section {
      background: var(--card);
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 20px var(--shadow);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      padding: 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Georgia', serif;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--highlight);
      box-shadow: 0 0 0 3px rgba(198,169,97,0.2);
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .confirm {
      display: inline-block;
      background: var(--highlight);
      color: var(--text);
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 1rem;
    }

    .confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(198,169,97,0.4);
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      padding: 0.8rem;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .order-item span:first-child {
      font-weight: 500;
    }

    .order-item span:last-child {
      color: var(--highlight);
      font-weight: bold;
    }

    .total-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 2px solid var(--border);
      text-align: right;
    }

    .total-section strong {
      font-size: 1.3rem;
      color: var(--accent);
    }

    .total-section span {
      color: var(--highlight);
      font-weight: bold;
      font-size: 1.5rem;
      margin-right: 0.5rem;
    }

    .empty-order {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text);
    }

    .empty-order i {
      font-size: 3rem;
      color: var(--highlight);
      margin-bottom: 1rem;
    }

    footer {
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }

    @media (max-width: 992px) {
      header h1 {
        font-size: 1.6rem;
      }

      nav ul {
        gap: 1.2rem;
      }

      nav a {
        font-size: 1rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      .form-section, .summary-section {
        padding: 1.8rem;
      }
    }

    @media (max-width: 768px) {
      :root {
        --nav-height: 60px;
      }

      header {
        padding: 1rem 4%;
      }

      header h1 {
        font-size: 1.4rem;
      }

      nav {
        padding: 0 4%;
      }

      nav ul {
        display: none;
      }

      .tognav {
        display: flex;
      }

      .mobile-menu {
        display: block;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
      }

      main {
        flex-direction: column;
        padding: 2.5rem 4%;
        gap: 2rem;
      }

      .form-section, .summary-section {
        max-width: 100%;
        padding: 1.5rem 1.2rem;
      }

      h2 {
        font-size: 1.3rem;
        margin-bottom: 1.2rem;
      }

      .form-control {
        padding: 0.8rem;
        font-size: 0.95rem;
      }

      textarea.form-control {
        min-height: 90px;
      }

      .confirm {
        padding: 0.85rem 1.8rem;
        font-size: 0.95rem;
      }

      .order-item {
        padding: 0.7rem;
        font-size: 0.95rem;
      }

      .total-section strong {
        font-size: 1.15rem;
      }

      .total-section span {
        font-size: 1.3rem;
      }

      footer {
        padding: 1.2rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 0.8rem 3%;
      }

      header h1 {
        font-size: 1.2rem;
      }

      nav {
        padding: 0 3%;
      }

      main {
        padding: 2rem 3%;
        gap: 1.5rem;
      }

      .form-section, .summary-section {
        padding: 1.3rem 1rem;
        border-radius: 12px;
      }

      h2 {
        font-size: 1.2rem;
        margin-bottom: 1rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      .form-group label {
        font-size: 0.9rem;
      }

      .form-control {
        padding: 0.75rem;
        font-size: 0.9rem;
      }

      textarea.form-control {
        min-height: 80px;
      }

      .confirm {
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
      }

      .order-item {
        padding: 0.6rem;
        font-size: 0.88rem;
        flex-direction: column;
        gap: 0.3rem;
      }

      .order-item span:last-child {
        align-self: flex-end;
      }

      .total-section {
        margin-top: 1.2rem;
        padding-top: 1.2rem;
      }

      .total-section strong {
        font-size: 1.05rem;
      }

      .total-section span {
        font-size: 1.2rem;
      }

      .empty-order i {
        font-size: 2.5rem;
      }

      footer {
        padding: 1rem;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 360px) {
      header h1 {
        font-size: 1.1rem;
      }

      .form-section, .summary-section {
        padding: 1.1rem 0.9rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      .form-control {
        font-size: 0.85rem;
      }

      .order-item {
        font-size: 0.82rem;
      }

      .total-section strong {
        font-size: 1rem;
      }

      .total-section span {
        font-size: 1.1rem;
      }

      .confirm {
        padding: 0.75rem 1.3rem;
        font-size: 0.88rem;
      }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      :root {
        --nav-height: 55px;
      }

      header {
        padding: 0.6rem 3%;
      }

      header h1 {
        font-size: 1.1rem;
      }

      nav {
        padding: 0 3%;
      }

      main {
        padding: 1.5rem 3%;
        gap: 1.2rem;
      }

      .form-section, .summary-section {
        padding: 1.2rem 1rem;
      }

      h2 {
        font-size: 1.1rem;
        margin-bottom: 0.8rem;
      }

      .form-group {
        margin-bottom: 0.8rem;
      }

      .form-control {
        padding: 0.7rem;
        font-size: 0.88rem;
      }

      textarea.form-control {
        min-height: 70px;
      }

      .confirm {
        padding: 0.75rem 1.3rem;
        font-size: 0.88rem;
      }

      .order-item {
        padding: 0.6rem;
        font-size: 0.85rem;
      }

      .total-section strong {
        font-size: 1rem;
      }

      .total-section span {
        font-size: 1.15rem;
      }

      footer {
        padding: 0.8rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Furniture Store</h1>
  </header>

  <nav>
    <div class="nav-container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html">🛒 <span class="cart-count">0</span></a></li>
      </ul>
      <div class="nav-right">
        <button id="toggletheme" class="theme-toggle">
          <i class="fas fa-moon"></i>
        </button>
        <button class="tognav" id="tognav">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobilemenu">
    <ul>
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
      <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
      <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
      <li><a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count">0</span></a></li>
    </ul>
  </div>

  <main>
    <div class="form-section">
      <h2>Reservation Details</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" class="form-control" placeholder="Street, City, ZIP" required></textarea>
        </div>
        <div class="form-group">
          <label for="notes">Special Instructions (Optional)</label>
          <textarea id="notes" class="form-control"></textarea>
        </div>
        <button type="submit" class="confirm">Confirm Reservation</button>
      </form>
    </div>

    <div class="summary-section">
      <h2>Order Summary</h2>
      <div id="summaryorder"></div>
      <div class="total-section">
        <strong>Total:</strong>
        <span id="totamount">$0</span>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Furniture Store. Crafted with care.</p>
  </footer>

  <script src="darkmode.js"></script>
  <script>
    function summload() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const summ = document.getElementById('summaryorder');
      const totamount = document.getElementById('totamount');

      if (cart.length === 0) {
        summ.innerHTML = `
          <div class="empty-order">
            <i class="fas fa-shopping-bag"></i>
            <p>No items in your order.</p>
          </div>
        `;
        totamount.textContent = '$0';
        return;
      }

      let total = 0;
      let html = '';
      cart.forEach(item => {
        const price = parseFloat(item.price);
        const linetot = price * item.quantity;
        total += linetot;
        html += `<div class="order-item"><span>${item.name} × ${item.quantity}</span><span>$${linetot.toFixed(2)}</span></div>`;
      });

      summ.innerHTML = html;
      totamount.textContent = `$${total.toFixed(2)}`;
    }

    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('✅ Reservation confirmed!\nOur team will contact you within 24 hours to finalize delivery.');
      localStorage.removeItem('cart');
      window.location.href = 'index.html';
    });

    document.addEventListener('DOMContentLoaded', summload);
  </script>
</body>
</html>
